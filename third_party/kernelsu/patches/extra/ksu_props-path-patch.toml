# MapleSU · 离线/可复现 ksud 构建 · Cargo path patch 片段
#
# 为什么需要它（03 分册 §4.3 / §9-R7）：
#   applied/userspace/ksud/Cargo.toml 依赖 git 源：
#     prop-rs-android = { git = "https://github.com/KernelSU2/ksu_props", rev = "ddb6ee72…" }
#   CI 无网络（或要求可复现）时，用本仓同提交的全量源码走 path patch。
#
# 用法（**只是 CI 的准备工作**，不要提交进 applied/）：
#   1) export KSU_OFFLINE=1
#   2) 把下面片段追加到 third_party/kernelsu/applied/userspace/ksud/Cargo.toml 末尾
#   3) 再跑 build_ksud.sh
#   注意：applied/ 是可重建生成物；这一步属于「构建期注入」，重建 applied 后会丢，
#         所以不要手改库里的 Cargo.toml 期望它持久。
#
# 未覆盖的其它 git 依赖（必须联网或自建 vendor）：
#   android-bootimg  rev=150425b0…   （本机/仓库都没有副本）
#   adb_client / rustix fork / lsposed 相关（见 applied/userspace/ksud/Cargo.toml）
#
# ---- 追加到 applied/userspace/ksud/Cargo.toml ----
# [patch."https://github.com/KernelSU2/ksu_props"]
# prop-rs-android = { path = "../../../../third_party/ksu_props/src/crates/prop-rs-android" }
