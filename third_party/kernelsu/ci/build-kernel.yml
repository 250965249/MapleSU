# MapleSU · kernelsu.ko 多 KMI CI 构建流水线（Normal + Ultra companion）
#
# 用法：CI 仓库里把本文件复制到 `.github/workflows/build-kernel.yml`（本仓当前无 `.github/`，
# 且本子代理的写作用域是 third_party/kernelsu/**，故先落在 ci/ 下作为可复制交付物）。
#
# 设计约束：
#   * 固定 upstream commit（f4603d14…，官方 CI #5545）+ 固定补丁序列；
#   * 本机不可构建的原因（无 KDIR/内核树/clang/make、docker 不可用）见 README；
#   * 一块 matrix leg = 一个 KMI = 一个 DDK 镜像（`ghcr.io/ylarod/ddk-min:<kmi>-<release>`）；
#   * 独立 KMI 构建不提升 payload 源码代次；完整 build_all.sh 成功后统一登记，
#     再跑 verify_payload.py，保留真实失败状态。
#
# Normal follows all eight official KMI targets; Ultra companions keep their six targets.
# Both lists come from scripts/ksu_common.py.
#
# 单跑/重跑某一个 KMI（失败腿重跑）：
#   gh workflow run build-kernel -f kmis=android14-6.1
#   gh run rerun <run-id> --failed        # GitHub 侧只重跑失败腿
name: build-kernel

on:
  workflow_dispatch:
    inputs:
      kmis:
        description: "KMI list: 'all' or comma/space separated (e.g. android14-6.1,android16-6.12)"
        required: false
        default: "all"
      ddk_release:
        description: "DDK release tag (ghcr.io/ylarod/ddk-min:<kmi>-<release>)"
        required: false
        default: "20260828"

permissions:
  contents: read

env:
  # Release identity is read from manifest.json after checkout.
  KSU_IS_PR_BUILD: "0"
  DDK_RELEASE: ${{ inputs.ddk_release || '20260828' }}

jobs:
  # ---------------------------------------------------------------- matrix plan
  # 用一次 shell 解析 inputs → JSON 矩阵，非法 KMI 直接失败（不静默跳过）。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      companions: ${{ steps.plan.outputs.companions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: plan
        name: Resolve KMI matrix
        env:
          RAW: ${{ inputs.kmis }}
        run: |
          set -euo pipefail
          ALL="$(python3 -c 'import sys; sys.path.insert(0, "third_party/kernelsu/scripts"); import ksu_common as C; print(" ".join(C.KMI_MATRIX))')"
          if [ -z "${RAW:-}" ] || [ "$RAW" = "all" ]; then
            SEL="$ALL"
          else
            SEL="$(printf '%s' "$RAW" | tr ',;' '  ')"
          fi
          OUT=""
          for k in $SEL; do
            case " $ALL " in
              *" $k "*) ;;
              *) echo "::error::unknown KMI '$k' (allowed: $ALL)"; exit 2 ;;
            esac
            case " $OUT " in
              *" $k "*) continue ;;
            esac
            OUT="$OUT $k"
          done
          MATRIX="$(printf '%s' "$OUT" | python3 -c \
            'import json,sys; print(json.dumps(sys.stdin.read().split()))')"
          COUNT="$(printf '%s' "$OUT" | wc -w | tr -d ' ')"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          python3 -c 'import json,sys; sys.path.insert(0,"third_party/kernelsu/scripts"); import ksu_common as C; print("companions=" + json.dumps(C.COMPATIBILITY_KMI_MATRIX))' >> "$GITHUB_OUTPUT"
          echo "KMI matrix ($COUNT): $OUT"

  # ---------------------------------------------------------------- build legs
  build-lkm:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    name: lkm-${{ matrix.kmi }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        kmi: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # DDK 是 x86_64 Linux 容器：每腿用对应 KMI 的镜像（ubuntu runner 上跑）
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ inputs.ddk_release || '20260828' }}
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Required branch-tree source check
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq python3
          fi
          bash third_party/kernelsu/scripts/rebuild.sh --verify-only --source-only

      - name: Load release identity
        run: |
          python3 - <<'PY'
          import json, os
          identity = json.load(open("third_party/kernelsu/manifest.json", encoding="utf-8"))["identity"]
          keys = {"KSU_PACKAGE_NAME": "packageName", "KSU_EXPECTED_SIZE": "expectedSize",
                  "KSU_EXPECTED_HASH": "expectedHash", "KSU_VERSION_PIN": "ksuVersionPin",
                  "KSU_MANAGER_MIN_GEN": "managerMinGen"}
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, field in keys.items():
                  output.write(f"{key}={identity[field]}\n")
          PY

      - name: Build Normal and Ultra companion (DDK, ${{ matrix.kmi }})
        shell: bash
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/third_party/kernelsu/applied/kernel"
          OUT="$GITHUB_WORKSPACE/third_party/kernelsu/lkm"
          mkdir -p "$OUT"
          cc "$SOURCE/tools/check_symbol.c" -o /tmp/check_symbol
          for mode in kernelsu maplesu_vr; do
            if [ "$mode" = maplesu_vr ]; then
              python3 -c 'import sys; sys.path.insert(0,"third_party/kernelsu/scripts"); import ksu_common as C; sys.exit(0 if sys.argv[1] in C.COMPATIBILITY_KMI_MATRIX else 1)' "$KMI" || continue
            fi
            WORK="$(mktemp -d)"
            cp -a "$SOURCE/." "$WORK/"
            VR_ONLY=0
            [ "$mode" != maplesu_vr ] || VR_ONLY=1
            if [ "$KMI" = android17-6.18 ]; then
              KBUILD_ARGS=(M="$WORK" MO="$WORK")
            else
              KBUILD_ARGS=(M="$WORK" src="$WORK")
            fi
            make -C "$KDIR" "${KBUILD_ARGS[@]}" CONFIG_KSU=m MAPLESU_VR_ONLY="$VR_ONLY" \
              KSU_PACKAGE_NAME="$KSU_PACKAGE_NAME" KSU_EXPECTED_SIZE="$KSU_EXPECTED_SIZE" \
              KSU_EXPECTED_HASH="$KSU_EXPECTED_HASH" KSU_VERSION_PIN="$KSU_VERSION_PIN" \
              KSU_MANAGER_MIN_GEN="$KSU_MANAGER_MIN_GEN" KSU_IS_PR_BUILD="$KSU_IS_PR_BUILD" \
              modules -j2 2>&1 | tee "$OUT/${KMI}_${mode}_build.log"
            KO="$WORK/$mode.ko"
            test -s "$KO"
            /tmp/check_symbol "$KO" "$KDIR/vmlinux"
            cp "$KO" "$OUT/${KMI}_${mode}.ko"
            sha256sum "$OUT/${KMI}_${mode}.ko" > "$OUT/${KMI}_${mode}.ko.sha256"
          done

      - name: Upload ${{ matrix.kmi }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernelsu-${{ matrix.kmi }}
          if-no-files-found: error
          path: |
            third_party/kernelsu/lkm/${{ matrix.kmi }}_*.ko
            third_party/kernelsu/lkm/${{ matrix.kmi }}_*.ko.sha256
            third_party/kernelsu/lkm/${{ matrix.kmi }}_*_build.log

  # ---------------------------------------------------------------- one bundle
  # Bundle Normal artifacts and the existing Ultra companions without expanding Ultra scope.
  bundle:
    needs: [prepare, build-lkm]
    if: always() && needs.build-lkm.result != 'skipped'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download every KMI artifact
        uses: actions/download-artifact@v8
        with:
          pattern: kernelsu-*
          path: lkm
          merge-multiple: true

      - name: Summarize (present / missing)
        env:
          EXPECTED: ${{ needs.prepare.outputs.matrix }}
          COMPANIONS: ${{ needs.prepare.outputs.companions }}
        run: |
          set -euo pipefail
          ls -la lkm || true
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          companions = set(json.loads(os.environ["COMPANIONS"]))
          expected = [f"{k}_{mode}.ko" for k in json.loads(os.environ["EXPECTED"])
                      for mode in (("kernelsu", "maplesu_vr") if k in companions else ("kernelsu",))]
          root = pathlib.Path("lkm")
          rows = []
          for name in expected:
              ko = next(iter(root.rglob(name)), None)
              row = {"name": name, "present": ko is not None}
              if ko is not None:
                  data = ko.read_bytes()
                  row.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              rows.append(row)
          out = pathlib.Path("lkm/matrix-summary.json")
          out.write_text(json.dumps({"kmis": rows, "present": sum(r["present"] for r in rows),
                                     "expected": len(expected)}, indent=2) + "\n", encoding="utf-8")
          print(out.read_text())
          missing = [r["name"] for r in rows if not r["present"]]
          print(f"present={len(rows)-len(missing)}/{len(expected)} missing={missing}")
          PY

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: kernelsu-lkm-bundle
          if-no-files-found: warn
          path: lkm
