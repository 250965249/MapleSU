name: GhostSam fork build matrix (MapleSU Samsung delta + test-signed Manager)

# Fork branch CI. Requires the owner to Enable Actions on the fork (web UI) once.
# 触发：workflow_dispatch（任意分支手动） + 分支 push（maple-su-samsung / ghostsam/**）。
on:
  workflow_dispatch:
  push:
    branches:
      - maple-su-samsung
      - 'ghostsam/**'

permissions:
  contents: read

concurrency:
  group: ghostsam-build-${{ github.ref }}
  cancel-in-progress: false

env:
  MAPLESU_PYTHON: python3
  DDK_RELEASE: '20260828'
  KSUD_PRODUCT_NAME: ksud-maplesu
  # ---------------------------------------------------------------------------
  # GhostSam fork TEST-ONLY signing pins (public keystore: keystore/ghostsam-test.keystore).
  # Kernel expected manager-cert fingerprint, consumed by build_lkm.sh via the
  # KSU_EXPECTED_SIZE / KSU_EXPECTED_HASH env channel (does NOT edit applied/ or manifest.json).
  #   DER bytes = 911 ; sha256(cert.der) = cd0c477b…db90 (see keystore/README.md).
  # The SAME test cert signs the Manager APK below, so Manager APK / LKM / ksud stay consistent.
  # ⚠ PUBLIC TEST SIGNATURE — replace with private signing before any real distribution.
  # ---------------------------------------------------------------------------
  KSU_EXPECTED_SIZE: '911'
  KSU_EXPECTED_HASH: 'cd0c477bcacc58c694367cb9a2f696d3bfd5de3e0ee8a0e25451cecbf312db90'
  GHOSTSAM_TEST_KEYSTORE: keystore/ghostsam-test.keystore
  GHOSTSAM_TEST_KEY_ALIAS: ghostsam-test
  GHOSTSAM_TEST_STORE_PASSWORD: GhostSamTest2026
  GHOSTSAM_TEST_KEY_PASSWORD: GhostSamTest2026

defaults:
  run:
    shell: bash

jobs:
  # ===========================================================================
  # Job A: LKM (DDK) + ksud-maplesu, one per Normal KMI. Uses KSU_EXPECTED_* env.
  # ===========================================================================
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi:
          # --- BUDGET-TRIM PROFILE (branch ghostsam/adapter-trim) -----------------
          # 2026-11-27: account-level Actions enforcement (422 "Actions has been
          # disabled") after heavy multi-round builds. This branch trims the
          # matrix to the two KMI the owner's devices actually run, so the first
          # post-unblock run stays small and cannot re-trigger enforcement:
          #   android12-5.10  (S22)   android16-6.12  (S26 / zf8)
          # release-ksud gate below expects 4 ko (2 normal + 2 exynos).
          # Restore the full matrix by reverting this commit (also reverts the
          # staged==4 gate back to 16). CI-only diff vs 13d1ccc (P1 fix).
          - android12-5.10
          - android16-6.12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust target + libclang (F6)
        # F6 precise fix (run 45774114076): the previous `rustup toolchain install 1.99.1
        # --target aarch64-linux-android` succeeded but installed the target into the
        # 1.99.1 toolchain, while build_ksud.sh runs on the runner DEFAULT toolchain
        # (rustc 1.100.0), so build_ksud.sh:88-89 still saw the target as missing.
        # Install the aarch64 target UNCONDITIONALLY into the default toolchain here.
        # NDK 27.3.13750724 is auto-discovered, no extra NDK env is required.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          rustup target add aarch64-linux-android
          # Prove the default toolchain now has the target build_ksud.sh checks for.
          rustup target list --installed | grep -q aarch64-linux-android
      - name: Apply MapleSU base series + GhostSam/Samsung extension
        run: |
          set -euo pipefail
          python3 third_party/kernelsu/scripts/apply_patches.py --clean --extension-series third_party/kernelsu/patches/7k/series-ghostsam
          python3 scripts/ghostsam_patch_dryrun.py
      - name: Build LKM via DDK (Normal KMI, test-cert pin via env)
        # KSU_EXPECTED_SIZE / KSU_EXPECTED_HASH inherited from workflow env above
        run: |
          set -euo pipefail
          echo "expected size=$KSU_EXPECTED_SIZE hash=$KSU_EXPECTED_HASH"
          # F2: the DDK image is not preloaded on the runner; pull the per-KMI tag and pass it.
          DDK_IMAGE="ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${DDK_RELEASE}"
          docker pull "$DDK_IMAGE"
          bash third_party/kernelsu/scripts/build_lkm.sh --kmi "${{ matrix.kmi }}" --ddk-image "$DDK_IMAGE"
          # Permanent symbol gate: fail loud if the Samsung delta was silently compiled
          # out of the release ko (device-panic root cause: RKP early-return stripped ->
          # bare ko with 0 samsung symbols). Guards the KDP / DEFEX / RKP paths.
          ko="third_party/kernelsu/lkm/${{ matrix.kmi }}_kernelsu.ko"
          test -f "$ko" || { echo "::error::missing LKM output $ko"; exit 1; }
          check_sym() {
            local pat="$1" label="$2" n
            n=$(strings -a "$ko" | grep -cE "$pat" || true)
            echo "symbol gate: $label ($pat) = $n"
            if [ "${n:-0}" -le 0 ]; then
              echo "::error::Samsung delta missing '$label' in $ko — silent bare ko"; exit 1
            fi
          }
          check_sym 'samsung_kdp' 'KDP'
          check_sym 'defex_enforce' 'DEFEX'
          check_sym 'MAPLESU_RKP|patch_text disabled for this Samsung target' 'RKP'
      - name: Rebuild ksud (ksud-maplesu) embedding KMI ko
        run: |
          set -euo pipefail
          # NDK 兜底（runner 通常已设 ANDROID_NDK_HOME；缺失时回落到 SDK 内置 27.3）。
          : "${ANDROID_NDK_HOME:=$ANDROID_HOME/ndk/27.3.13750724}"
          export ANDROID_NDK_HOME
          # CI 内置探针（分析报告 §3.1，本轮 CI 证据）：证明 NDK clang 可执行且目标 sysroot 头可解析。
          llvm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$llvm/bin/clang"
          test -d "$llvm/sysroot/usr/include"
          printf '#include <stdint.h>\nuint32_t ci_probe(void);\n' | "$llvm/bin/clang" --target=aarch64-linux-android24 --sysroot="$llvm/sysroot" -fsyntax-only -x c -
          KSUD_TREE=exynos bash third_party/kernelsu/scripts/build_ksud.sh --kmi "${{ matrix.kmi }}" || \
            bash third_party/kernelsu/scripts/build_ksud.sh --kmi "${{ matrix.kmi }}"
      - name: Package ksud-maplesu[-exynos] assets
        run: |
          set -euo pipefail
          name="ksud-maplesu/${{ matrix.kmi }}_kernelsu.ko"
          exynos="ksud-maplesu-exynos/${{ matrix.kmi }}-exynos_kernelsu.ko"
          mkdir -p "out/$(dirname "$name")" "out/$(dirname "$exynos")"
          src="third_party/kernelsu/lkm/${{ matrix.kmi }}_kernelsu.ko"
          [ -f "$src" ] && cp "$src" "out/$name" && cp "$src" "out/$exynos" || true
          # F3: export the recompiled ksud product + sidecar under the exact names GhostSam fetches.
          ksud="manager/src/main/jniLibs/arm64-v8a/libksud_ksu.so"
          if [ -f "$ksud" ]; then
            cp "$ksud" "out/ksud-maplesu-aarch64"
            {
              echo 'variant=maplesu'
              echo 'build_kind=samsung-ci'
              echo 'kernel_version_code=32650'
              echo 'kernel_uapi_version=7'
              echo 'version_name=5.2.1'
              echo 'source=FengQiuFQ/MapleSU'
              echo "test_cert_sha256=${KSU_EXPECTED_HASH}"
              echo "test_cert_size=${KSU_EXPECTED_SIZE}"
            } > "out/ksud-maplesu-aarch64.version"
          else
            echo "::error::ksud product missing: $ksud"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ksud-maplesu-${{ matrix.kmi }}
          path: out/
          if-no-files-found: warn

  # ===========================================================================
  # Job A2: release-ksud 组装（矩阵产出的 LKM ko 全量内嵌成单一 ksud-maplesu）。
  #   理由：GhostSam 全设备只捆绑一个 ksud-maplesu；late_load.rs:55 从内嵌 assets 按
  #   {kmi}_kernelsu.ko 解析 ko，单 ko ksud 无法同时服务 s22(android12-5.10) 与
  #   s26/zf8(android16-6.12)。本作业把矩阵 2×2 个 ko 全部放进 RustEmbed folder
  #   applied/userspace/ksud/bin/aarch64/（assets.rs:45）后重编 ksud。
  # ===========================================================================
  release-ksud:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust target + libclang (同 matrix)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          rustup target add aarch64-linux-android
          rustup target list --installed | grep -q aarch64-linux-android
      - name: Apply MapleSU base series + GhostSam/Samsung extension
        run: |
          set -euo pipefail
          python3 third_party/kernelsu/scripts/apply_patches.py --clean --extension-series third_party/kernelsu/patches/7k/series-ghostsam
      - name: Download matrix ksud artifacts (trimmed 12-5.10 + 16-6.12)
        uses: actions/download-artifact@v4
        with:
          pattern: ksud-maplesu-*
          path: download
          merge-multiple: false
      - name: Stage 4 embedded ko into bin/aarch64 (+ lkm placeholder)
        run: |
          set -euo pipefail
          # 真实 RustEmbed folder：assets.rs:45 #[folder="bin/aarch64"] 相对 crate 目录，
          # crate 在 third_party/kernelsu/applied/userspace/ksud
          # （T2 日志 target_directory 已证 applied 位于 third_party/kernelsu/ 下）。
          bin=third_party/kernelsu/applied/userspace/ksud/bin/aarch64
          mkdir -p "$bin" third_party/kernelsu/lkm
          for ko in $(find download -type f -name '*_kernelsu.ko' | sort); do
            cp -f "$ko" "$bin/"
          done
          staged=$(find "$bin" -maxdepth 1 -name '*_kernelsu.ko' | wc -l | tr -d ' ')
          echo "staged $staged ko into $bin"
          [ "$staged" -eq 4 ] || { echo "::error::expected 4 ko (2 normal + 2 exynos, budget-trim profile) in $bin, got $staged"; find download -type f -name '*.ko'; exit 1; }
          # build_ksud.sh step2 需要 third_party/kernelsu/lkm/<kmi>_kernelsu.ko 作占位（会再复制进 bin）。
          cp -f "$bin/android16-6.12_kernelsu.ko" third_party/kernelsu/lkm/android16-6.12_kernelsu.ko
          ls -1 "$bin"
      - name: Build release ksud (embed all 4 ko)
        run: |
          set -euo pipefail
          : "${ANDROID_NDK_HOME:=$ANDROID_HOME/ndk/27.3.13750724}"
          export ANDROID_NDK_HOME
          [ -d "$ANDROID_NDK_HOME" ] || { echo "::error::ANDROID_NDK_HOME not found: $ANDROID_NDK_HOME"; exit 1; }
          llvm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$llvm/bin/clang"
          test -d "$llvm/sysroot/usr/include"
          printf '#include <stdint.h>\nuint32_t ci_probe(void);\n' | "$llvm/bin/clang" --target=aarch64-linux-android24 --sysroot="$llvm/sysroot" -fsyntax-only -x c -
          bash third_party/kernelsu/scripts/build_ksud.sh --kmi android16-6.12
      - name: Package ksud-maplesu-release (product + version sidecar)
        run: |
          set -euo pipefail
          ksud="manager/src/main/jniLibs/arm64-v8a/libksud_ksu.so"
          [ -f "$ksud" ] || { echo "::error::ksud product missing: $ksud"; exit 1; }
          mkdir -p out
          cp "$ksud" "out/ksud-maplesu-aarch64"
          # 版本戳自证（实证：build.rs VERSION_CODE = 30000 + `git rev-list --count HEAD`，
          # 已由 build_ksud.sh 合成 git 历史钉到 32650）。与 profile 检测口径一致：只认 5 位戳。
          strings -a out/ksud-maplesu-aarch64 | grep -q 'KSU_NO_NEW_PRIVS32650' \
            || { echo "::error::ksud binary lacks KSU_NO_NEW_PRIVS32650"; strings -a out/ksud-maplesu-aarch64 | grep -oE 'KSU_NO_NEW_PRIVS[0-9]{5}' | sort -u; exit 1; }
          codes=$(strings -a out/ksud-maplesu-aarch64 | grep -oE 'KSU_NO_NEW_PRIVS[0-9]{5}' | sed 's/^KSU_NO_NEW_PRIVS//' | sort -u | tr '\n' ',')
          echo "ksud 5-digit stamps: [$codes]（须唯一 32650，与 sidecar kernel_version_code=32650 一致）"
          [ "$codes" = "32650," ] || { echo "::error::ksud stamps [$codes] != [32650,]"; exit 1; }
          # 复用矩阵 Packaging 步骤的 sidecar 块（字段保持一致）。
          {
            echo 'variant=maplesu'
            echo 'build_kind=samsung-ci'
            echo 'kernel_version_code=32650'
            echo 'kernel_uapi_version=7'
            echo 'version_name=5.2.1'
            echo 'source=FengQiuFQ/MapleSU'
            echo "test_cert_sha256=${KSU_EXPECTED_HASH}"
            echo "test_cert_size=${KSU_EXPECTED_SIZE}"
          } > "out/ksud-maplesu-aarch64.version"
          echo "OK: out/ksud-maplesu-aarch64"
      - uses: actions/upload-artifact@v4
        with:
          name: ksud-maplesu-release
          path: out/
          if-no-files-found: error

  # ===========================================================================
  # Job B: test-signed Manager APK (windows-latest, mirrors build-manager.yml toolchain).
  # Signs :manager:assembleRelease with the committed public test keystore and
  # publishes a fixed-name artifact: MapleSU-Manager-ghostsam-test.apk
  # ===========================================================================
  manager:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Install build inputs
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'cmdline-tools;latest'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-37.0' 'build-tools;37.0.0' 'cmake;3.22.1' 'ndk;26.1.10909125' 'ndk;28.2.13676358' 'ndk;29.0.14206865'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --target aarch64-linux-android
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r requirements-native.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MAPLESU_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" >> $env:GITHUB_ENV
      - name: Prepare retained native inputs (F7c; mirror build-manager.yml)
        run: |
          if (Test-Path .handoff/source-files.json) {
            python .handoff/source_snapshot.py verify --repair
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python tools/check_source_export.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python jailbreak-providers/ghostlock/build_extractor.py --verify-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # F7c: DOWNLOAD+verify the pinned public native inputs (busybox, the eight
          # DirtyFrag stock .ko) from their fixed GitHub raw sources when a fork
          # checkout does not carry them. Every byte is re-checked against
          # release/source-policy.json (size + sha256); a present input is only
          # re-verified, so the green path stays network-free. This is the
          # "prepare in CI" half of the native-input chain.
          python tools/prepare_native_inputs.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # F7c: regenerate the Ultra SDK build identity from the committed
          # SDK-RELEASE.json + libkernel_module_kit_static.a. The upstream `--check`
          # form is NOT usable on a fork (nor on upstream CI): it calls
          # verify_source_delivery(), which asserts on the private source-build report
          # `.tmp/p1-source-r9-build/report/build-report.json` (10.9 MB) that no
          # checkout contains. Generate mode needs only the committed manifest+archive.
          python scripts/sync-ultra-sdk-identity.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build_module_policy.py --prepare-only --offline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Fetch locked extractor dependencies
        run: |
          cargo +1.99.1-x86_64-pc-windows-gnu fetch --locked --target aarch64-linux-android --manifest-path jailbreak-providers/ghostlock/extractor-native/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # build_extractor.py:64 以 --offline 构建，android-target fetch 漏拉宿主(windows)依赖；
          # 追加同一工具链的 windows-gnu host-target fetch（run 45777330482: failed to download 'anstyle-wincon v3.0.11'）。
          cargo +1.99.1-x86_64-pc-windows-gnu fetch --locked --target x86_64-pc-windows-gnu --manifest-path jailbreak-providers/ghostlock/extractor-native/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build SDK and consumer
        run: |
          ./gradlew.bat :maplesu-client:assembleRelease :maplesu-consumer:assembleDebug --no-daemon --no-build-cache --no-configuration-cache --max-workers=2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Assert test keystore present
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/$env:GHOSTSAM_TEST_KEYSTORE")) {
            throw "Missing test keystore: $env:GHOSTSAM_TEST_KEYSTORE (see keystore/README.md)"
          }
      - name: Prefetch manager host JVM deps for specgen (seed Gradle module cache)
        env:
          MINGW_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./gradlew.bat :manager:compileReleaseKotlin --no-daemon --no-build-cache --no-configuration-cache --max-workers=2 '-PmaplesuRustToolchain=1.99.1-x86_64-pc-windows-gnu' "-PmaplesuMingwBin=$env:MINGW_ROOT/ucrt64/bin"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build signed test Manager APK (keystore/ghostsam-test.keystore)
        env:
          MAPLE_RELEASE_STORE_FILE: ${{ github.workspace }}/keystore/ghostsam-test.keystore
          MAPLE_RELEASE_STORE_PASSWORD: ${{ env.GHOSTSAM_TEST_STORE_PASSWORD }}
          MAPLE_RELEASE_KEY_ALIAS: ${{ env.GHOSTSAM_TEST_KEY_ALIAS }}
          MAPLE_RELEASE_KEY_PASSWORD: ${{ env.GHOSTSAM_TEST_KEY_PASSWORD }}
          MINGW_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./gradlew.bat :manager:assembleRelease --no-daemon --no-build-cache --no-configuration-cache --max-workers=2 '-PmaplesuRustToolchain=1.99.1-x86_64-pc-windows-gnu' "-PmaplesuMingwBin=$env:MINGW_ROOT/ucrt64/bin" -PmaplesuAllowMissingUltraClaim=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $apk = Get-ChildItem -Recurse 'manager/build/outputs/apk/release/*.apk' | Select-Object -First 1
          if (-not $apk) { throw 'No release APK produced.' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $apk.FullName 'out/MapleSU-Manager-ghostsam-test.apk' -Force
          Write-Host "Built: $($apk.FullName)"
      - name: Verify APK signing cert == test keystore (public test-only)
        run: |
          $apksigner = Join-Path $env:ANDROID_HOME 'build-tools/37.0.0/apksigner.bat'
          & $apksigner verify --print-certs 'out/MapleSU-Manager-ghostsam-test.apk'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: MapleSU-Manager-ghostsam-test
          path: out/MapleSU-Manager-ghostsam-test.apk
          if-no-files-found: error
      - name: Upload manager failure diagnostics (F7/F7c)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manager-failure-logs
          # F7c: mirror build-manager.yml's "Upload native build diagnostics" so the
          # exact :manager:buildJailbreakProviders native error is captured (build.py
          # writes it to manager/build/jailbreakProviders/build.log, never to stdout).
          path: |
            manager/build/jailbreakProviders/**/build.json
            manager/build/jailbreakProviders/**/build.log
            manager/build/jailbreakProviders/**/verify-build.txt
            **/build/reports/**
            **/*.log
          if-no-files-found: warn
